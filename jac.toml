[project]
name = "studypilot"
version = "1.0.0"
description = "StudyPilot: a personal coursework + life planner with a web app, a mobile app and a CLI over one Jac backend"
default-app = "web"
jac-version = "==0.37.23"

# One shared core, four faces. `jac run` (default-app) serves the web app and
# colocates the `planner` service in the same process; mobile and cli bridge to it.
[apps.web]
kind = "web-app"
entry-point = "web.main"

[apps.mobile]
kind = "mobile"
entry-point = "mobile.main"

[apps.cli]
kind = "cli"
entry-point = "cli.main"

[apps.planner]
kind = "service"
entry-point = "core.planner"

[test]
directories = ["core", "cli"]

[apps.cli.test]
directories = ["."]

[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
zod = "^4.3.6"
lucide-react = "^0.469.0"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"

[apps.mobile.dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-native-web = "^0.19.13"
react-native-svg = "^15.13.0"
lucide-react = "^0.469.0"
lucide-react-native = "^0.469.0"

[apps.mobile.dependencies.npm.native]
react-native-svg = "^15.13.0"
lucide-react-native = "^0.469.0"

[client.app_meta_data]
title = "StudyPilot"
description = "Plan coursework and life: smart daily plan, quick-add, web + mobile + CLI."
theme_color = "#4f46e5"
